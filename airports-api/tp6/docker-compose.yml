services:
  mongo:
    image: mongo:7
    container_name: tp6-mongo
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  redis-geo:
    image: redis:7-alpine
    container_name: tp6-redis-geo
    ports: ["6379:6379"]

  redis-pop:
    image: redis:7-alpine
    container_name: tp6-redis-pop
    ports: ["6380:6379"]

  backend:
    build: ./backend
    container_name: tp6-backend
    ports: ["3000:3000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: airport_db
      REDIS_GEO_URL: redis://redis-geo:6379
      REDIS_POP_URL: redis://redis-pop:6379
      PORT: "3000"
      SEED_ON_START: "true"
    depends_on: [mongo, redis-geo, redis-pop]
    volumes:
      - ./data:/app/data:ro

  frontend:
    image: nginx:alpine
    container_name: tp6-frontend
    ports: ["8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on: [backend]

volumes:
  mongo_data:
